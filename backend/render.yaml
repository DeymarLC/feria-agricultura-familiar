# ============================================================
# render.yaml — Blueprint de despliegue en Render.
#
# Define DOS servicios:
#   1. database   → PostgreSQL (gratuito). Render expone DATABASE_URL.
#   2. web        → API Flask servida con gunicorn.
#
# Instrucciones: en Render → "New +" → "Blueprint" → conectar este
# repositorio (o subir la carpeta backend/ como raíz del servicio).
# ============================================================

services:
  - type: web
    name: feria-agricultura-familiar-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: ./render-build.sh
    startCommand: gunicorn run:app --bind 0.0.0.0:$PORT --workers 2
    healthCheckPath: /api/health
    envVars:
      - key: FLASK_ENV
        value: production
      # CORS permitido: la URL de TU frontend desplegado (nunca *).
      - key: CORS_ORIGINS
        value: https://feria-agricultura-familiar.onrender.com
      - key: JWT_EXPIRES_MINUTES
        value: "60"
      # Secretos generados automáticamente por Render.
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      # Conexión a la base de datos del mismo blueprint.
      - key: DATABASE_URL
        fromDatabase:
          name: feria-agricultura-familiar-db
          property: connectionString

databases:
  - name: feria-agricultura-familiar-db
    plan: free
    # El plan gratuito tiene una política: la base expira a los 30 días.
    # Para demos de la materia alcanza; para producción real usar un plan de pago.