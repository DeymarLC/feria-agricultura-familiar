# ============================================================
# render.yaml — Blueprint de despliegue en Render.
#
# Estrategia "todo-en-uno": UN Web Service (Python/Gunicorn) sirve
# la API Flask Y el frontend compilado (dist/ → mismo origen).
#
# Build  → ./render-build.sh (compila React, instala Python, migra la BD).
# Start  → gunicorn run:app  (Flask sirve /api + /apidocs + el SPA).
#
# IMPORTANTE (secretos):
#   - DATABASE_URL se pega MANUALMENTE en Render (base Supabase real).
#     Con sync:false Render NO crea un Postgres propio.
#   - SECRET_KEY y JWT_SECRET se generan automáticamente.
# ============================================================

services:
  - type: web
    name: feria-agricultura-familiar
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: ./render-build.sh
    startCommand: gunicorn run:app --bind 0.0.0.0:$PORT --workers 2
    healthCheckPath: /api/health
    envVars:
      - key: FLASK_ENV
        value: production
      # CORS: en producción el SPA es mismo-origen, así que no se dispara.
      # Se deja la URL pública por si se consume la API desde otro origen.
      - key: CORS_ORIGINS
        value: https://feria-agricultura-familiar.onrender.com
      - key: JWT_EXPIRES_MINUTES
        value: "60"
      # Secretos generados automáticamente por Render.
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      # Conexión a Supabase (base real del proyecto). Se pega en Render:
      #   postgresql://postgres.<ref>:<password>@aws-0-us-east-2.pooler.supabase.com:5432/postgres?sslmode=require
      - key: DATABASE_URL
        sync: false