<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="t1">
  <title id="t1">Puestos de frutas y verduras en una feria urbana al amanecer</title>
  <defs>
