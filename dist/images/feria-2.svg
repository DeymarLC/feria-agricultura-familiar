<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="t2">
  <title id="t2">Campos de cultivo y una pequeña finca de agricultura familiar en los llanos</title>
  <defs>
    <linearGradient id="f2-cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fd0ef" />
      <stop offset="0.55" stop-color="#cfe8f2" />
      <stop offset="1" stop-color="#fdf3d0" />
    </linearGradient>
    <linearGradient id="f2-campo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cb56a" />
      <stop offset="0.5" stop-color="#4f9a52" />
      <stop offset="1" stop-color="#2f7d4a" />
    </linearGradient>
    <linearGradient id="f2-cultivo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2d06b" />
      <stop offset="1" stop-color="#d9a441" />
    </linearGradient>
    <radialGradient id="f2-sol" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6d0" />
      <stop offset="0.6" stop-color="#fcd34d" />
      <stop offset="1" stop-color="#f59e0b" />
    </radialGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#f2-cielo)" />

  <!-- Sol -->
  <circle cx="240" cy="120" r="86" fill="url(#f2-sol)" />
  <circle cx="240" cy="120" r="130" fill="#fcd34d" opacity="0.18" />

  <!-- Nubes de tormenta -->
  <g fill="#ffffff" opacity="0.9">
    <ellipse cx="700" cy="110" rx="120" ry="38" />
    <ellipse cx="636" cy="126" rx="76" ry="30" />
    <ellipse cx="782" cy="128" rx="70" ry="28" />
    <ellipse cx="1060" cy="76" rx="86" ry="28" />
  </g>

  <!-- Cordillera lejana -->
  <path d="M0 300l150-96 120 70 130-96 170 104 150-78 180 96 130-70 170 92v58H0z" fill="#7f9c86" opacity="0.45" />

  <!-- Campo con surcos en perspectiva -->
  <path d="M0 322h1200v278H0z" fill="url(#f2-campo)" />
  <g stroke="#3f8a48" stroke-width="3" opacity="0.55">
    <path d="M-40 600 320 322M120 600 400 322M300 600 470 322M470 600 540 322M640 600 610 322M820 600 680 322M1000 600 750 322M1180 600 820 322" />
  </g>
  <g stroke="#2f7d4a" stroke-width="6" opacity="0.35">
    <path d="M0 372h1200M0 432h1200M0 506h1200M0 578h1200" />
  </g>

  <!-- Franja de cultivo dorado (trigo / quinua) -->
  <path d="M0 322h560l-70 96H0z" fill="url(#f2-cultivo)" />
  <g stroke="#b9862f" stroke-width="2.5" opacity="0.7">
    <path d="M20 336h470M10 366h430M0 398h370" />
  </g>

  <!-- Casa de la familia campesina -->
  <g transform="translate(742 236)">
    <rect x="0" y="76" width="220" height="104" rx="6" fill="#efe5d8" />
    <path d="M-18 78 110 8l128 70z" fill="#c05621" />
    <rect x="42" y="112" width="44" height="68" rx="4" fill="#9a6b3f" />
    <rect x="130" y="104" width="42" height="36" rx="4" fill="#cfe8f2" />
    <rect x="130" y="104" width="42" height="36" rx="4" fill="none" stroke="#9a6b3f" stroke-width="3" />
    <path d="M151 104v36M130 122h42" stroke="#9a6b3f" stroke-width="3" />
    <rect x="196" y="42" width="18" height="40" fill="#a97c50" />
    <g fill="#f59e0b" opacity="0.55"><circle cx="205" cy="30" r="14" /><circle cx="188" cy="26" r="10" /></g>
  </g>

  <!-- Molino de agua / bomba de riego -->
  <g transform="translate(1040 246)" fill="#4d341f">
    <rect x="-6" y="0" width="12" height="156" />
    <g transform="translate(0 -12)">
      <circle r="42" fill="none" stroke="#4d341f" stroke-width="7" />
      <g stroke="#4d341f" stroke-width="6" stroke-linecap="round">
        <path d="M0-38v76M-38 0h76M-27-27l54 54M27-27l-54 54" />
      </g>
    </g>
  </g>

  <!-- Cercas -->
  <g stroke="#9a6b3f" stroke-width="5" opacity="0.9">
    <path d="M0 452h1200M0 486h1200" />
    <path d="M40 440v58M120 440v58M200 440v58M280 440v58M360 440v58M440 440v58M520 440v58" />
  </g>

  <!-- Fardos de paja -->
  <g fill="#e8c76a" stroke="#c8a24d" stroke-width="3">
    <rect x="596" y="500" width="96" height="62" rx="10" />
    <rect x="704" y="518" width="82" height="54" rx="10" />
  </g>

  <!-- Productores cosechando -->
  <g fill="#173c25">
    <g transform="translate(300 494)">
      <circle cx="0" cy="0" r="19" />
      <path d="M-22 24c0-16 10-27 22-27s22 11 22 27z" />
      <rect x="30" y="-30" width="44" height="26" rx="8" fill="#d97706" />
    </g>
    <g transform="translate(430 520)">
      <circle cx="0" cy="0" r="16" />
      <path d="M-19 20c0-14 9-23 19-23s19 9 19 23z" />
      <rect x="26" y="-24" width="38" height="22" rx="7" fill="#f59e0b" />
    </g>
  </g>

  <!-- Árboles del horizonte -->
  <g fill="#25613a" opacity="0.85">
    <ellipse cx="118" cy="304" rx="52" ry="40" />
    <rect x="112" y="304" width="12" height="34" fill="#4d341f" />
    <ellipse cx="612" cy="316" rx="40" ry="32" />
    <rect x="607" y="316" width="10" height="26" fill="#4d341f" />
  </g>
</svg>
