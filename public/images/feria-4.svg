  <g>
    <g transform="translate(232 452)">
      <path d="M0-56h150l-14 56H14z" fill="#d97706" />
      <g fill="#f59e0b"><circle cx="42" cy="-64" r="20" /><circle cx="80" cy="-72" r="17" /><circle cx="116" cy="-62" r="19" /></g>
    </g>
    <g transform="translate(410 452)">
      <path d="M0-52h150l-14 52H14z" fill="#4d341f" />
      <g fill="#e05a4a"><circle cx="44" cy="-60" r="19" /><circle cx="84" cy="-66" r="16" /><circle cx="120" cy="-58" r="18" /></g>
    </g>
    <g transform="translate(588 452)">
      <path d="M0-56h150l-14 56H14z" fill="#25613a" />
      <g fill="#2f7d4a">
        <ellipse cx="48" cy="-66" rx="26" ry="16" /><ellipse cx="98" cy="-62" rx="24" ry="15" /><ellipse cx="140" cy="-70" rx="20" ry="13" />
