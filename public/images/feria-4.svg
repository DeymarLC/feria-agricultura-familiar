  <rect x="150" y="452" width="900" height="30" rx="10" fill="#b9862f" />
  <rect x="150" y="482" width="900" height="14" rx="6" fill="#8c6a2a" />
  <rect x="190" y="496" width="20" height="90" fill="#9a6b3f" />
  <rect x="990" y="496" width="20" height="90" fill="#9a6b3f" />

