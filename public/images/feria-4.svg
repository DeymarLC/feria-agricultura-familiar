<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="t4">
  <title id="t4">Mesa con productos de la temporada en un puesto de feria</title>
  <defs>
    <linearGradient id="f4-cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cde9d3" />
      <stop offset="0.55" stop-color="#eaf6e6" />
      <stop offset="1" stop-color="#fdf6e3" />
    </linearGradient>
    <radialGradient id="f4-sol" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6d8" />
      <stop offset="0.6" stop-color="#fcd34d" />
      <stop offset="1" stop-color="#f59e0b" />
    </radialGradient>
    <pattern id="f4-rayas" width="44" height="44" patternUnits="userSpaceOnUse">
      <rect width="44" height="44" fill="#ffffff" />
      <rect width="22" height="44" fill="#1e4d2e" />
    </pattern>
  </defs>

  <rect width="1200" height="600" fill="url(#f4-cielo)" />

  <!-- Sol -->
  <circle cx="1040" cy="130" r="76" fill="url(#f4-sol)" />

  <!-- Colinas suaves -->
  <g fill="#7cb56a" opacity="0.55">
